[project]
name = "trustscore"
version = "0.1.0"
description = "Sybil-resistant trust scores for ERC-8004 agents on Monad"
requires-python = ">=3.11"
dependencies = [
    "web3>=7.6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "hypersync>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trustscore*"]

[tool.setuptools.package-data]
trustscore = ["abi/*.json"]
